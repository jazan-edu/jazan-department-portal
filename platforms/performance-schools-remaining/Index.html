<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>منصة دورة الأداء</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --moe-green: #005F56; --moe-light-green: #17A086; --bg-color: #f4f7f6; }
    body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid var(--moe-green); position: relative; }
    
    .top-nav-buttons { position: absolute; top: 20px; left: 20px; display: flex; gap: 10px; align-items: center; z-index: 10; }
    .btn-portal { background: var(--moe-green); color: #fff; padding: 8px 15px; border-radius: 5px; cursor: pointer; border: none; font-size: 14px; font-weight: bold; font-family: 'Tajawal'; transition: 0.3s;}
    .btn-portal:hover { background: var(--moe-light-green); }
    .logout-btn { background-color: #d9534f; color: white; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-family: 'Tajawal'; font-size: 14px; transition: 0.3s; }
    .logout-btn:hover { background-color: #c9302c; }

    h2 { text-align: center; color: var(--moe-green); margin-top: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: var(--moe-green); font-weight: 500; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-family: 'Tajawal'; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .section-title { border-bottom: 2px solid #ddd; padding-bottom: 5px; margin: 30px 0 15px; color: var(--moe-light-green); }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table th, table td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
    table th { background: var(--moe-green); color: #fff; }
    button.submit-btn { background: var(--moe-green); color: #fff; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-family: 'Tajawal'; margin-top: 20px; font-size: 16px;}
    
    .stats-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-top: 15px; }
    .stat-item { background: #f9f9f9; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #eee; }
    .stat-value { display: block; font-size: 24px; font-weight: bold; color: var(--moe-green); }
    .stat-label { font-size: 13px; color: #666; font-weight: bold; }
    
    .slicer-container { background: #eef2f1; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-right: 4px solid var(--moe-green); }
    
    /* تنسيق حاوية الرسم البياني - ثابتة ومقيدة الحجم */
    .chart-wrapper { 
      position: relative; 
      width: 100%; 
      max-width: 450px; 
      height: 300px; 
      margin: 30px auto; 
      background: #fff; 
      padding: 20px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
    }
    
    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-nav-buttons">
    <button id="portalBtn" class="btn-portal" onclick="showLoginView()">بوابة القيادات</button>
    <button id="logoutBtn" class="logout-btn" style="display:none;" onclick="handleLogout()">تسجيل خروج</button>
  </div>
  
  <div id="mainView" class="view active">
    <h2>منصة دورة الأداء</h2>
    <form id="performanceForm">
      <h3 class="section-title">البيانات الأساسية</h3>
      
      <div class="grid-2">
        <div class="form-group">
          <label>اسم المشرف:</label>
          <select id="supervisorName" required><option value="" disabled selected>جاري التحميل...</option></select>
        </div>
        <div class="form-group">
          <label>المرحلة الدراسية:</label>
          <select id="studyPhase" required>
            <option value="" disabled selected>اختر المرحلة...</option>
            <option value="المرحلة الابتدائية">المرحلة الابتدائية</option>
            <option value="المرحلة المتوسطة">المرحلة المتوسطة</option>
            <option value="المرحلة الثانوية">المرحلة الثانوية</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>مرحلة دورة الأداء:</label>
          <select id="perfCycle" required>
            <option value="" disabled selected>اختر المرحلة...</option>
            <option value="المرحلة الأولى">المرحلة الأولى</option>
            <option value="المرحلة الثانية">المرحلة الثانية</option>
            <option value="المرحلة الثالثة">المرحلة الثالثة</option>
          </select>
        </div>
        <div class="form-group">
          <label>الجنس:</label>
          <select id="gender" required>
            <option value="" disabled selected>اختر الجنس...</option>
            <option value="ذكر">ذكر</option>
            <option value="أنثى">أنثى</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group"><label>عدد المدارس المسندة له:</label><input type="number" id="assignedCount" required></div>
        <div class="form-group"><label>عدد المدارس التي تمت زيارتها:</label><input type="number" id="visitedCount" required></div>
      </div>

      <div class="form-group"><label>عدد المدارس المتبقية:</label><input type="number" id="remainingCount" required oninput="generateTable()"></div>
      
      <div id="dynamicTableContainer"></div>
      <button type="submit" id="submitBtn" class="submit-btn">إرسال البيانات</button>
    </form>
  </div>

  <div id="loginView" class="view">
    <h2 style="margin-top:0">بوابة القيادات</h2>
    <div class="form-group" style="max-width:300px; margin:0 auto">
      <label>أدخل كود الدخول:</label>
      <input type="password" id="accessCode" placeholder="****">
      <div style="display: flex; gap: 10px; margin-top: 10px;"> 
        <button onclick="login()" class="submit-btn" style="margin: 0; width: auto; flex-grow: 1;">دخول</button>
        <button class="logout-btn" style="background:#666; margin: 0; width: auto; flex-grow: 1;" onclick="showView('mainView')">رجوع</button>
      </div>
    </div>
  </div>

  <div id="dashboardView" class="view">
    <h2 id="dashTitle" style="border-bottom: 2px solid var(--moe-green); padding-bottom: 15px; margin-bottom: 20px;">إحصائيات الأداء</h2>
    
    <div class="slicer-container">
      <label style="font-weight:bold; color:var(--moe-green);">تصفية الأداء حسب المشرف (Slicer):</label>
      <select id="supervisorSlicer" onchange="renderDashboard()"><option value="">عرض الكل (إجمالي القطاعات)</option></select>
    </div>

    <div id="dashboardContent"></div>
    
    <div class="chart-wrapper">
      <h4 style="text-align:center; color:var(--moe-green); margin-top:0;">توزيع المدارس المتبقية حسب القطاع</h4>
      <canvas id="remainingChart"></canvas>
    </div>
  </div>
</div>

<script>
  window.appMetadata = { supervisors: [], schools: [], uniqueSectors: [] };
  window.dashboardData = { basic: [], rem: [] };
  let remainingChartInstance = null;

  window.onload = function() {
    google.script.run.withSuccessHandler(function(data) {
      window.appMetadata = data;
      window.appMetadata.uniqueSectors = [...new Set(data.schools.map(s => s.sector))].filter(Boolean);
      
      let select = document.getElementById('supervisorName');
      select.innerHTML = '<option value="" disabled selected>اختر اسم المشرف...</option>';
      data.supervisors.forEach(sup => select.innerHTML += `<option value="${sup.name}">${sup.name}</option>`);
    }).getMetadata();
  };

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  function showLoginView() {
    document.getElementById('accessCode').value = ''; showView('loginView');
  }

  function handleLogout() {
    document.getElementById('accessCode').value = '';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('portalBtn').style.display = 'block';
    showView('mainView');
  }

  function generateTable() {
    const count = parseInt(document.getElementById('remainingCount').value) || 0;
    const container = document.getElementById('dynamicTableContainer');
    container.innerHTML = '';
    
    if (count > 0) {
      let sectorOptions = window.appMetadata.uniqueSectors.map(s => `<option value="${s}">${s}</option>`).join('');
      
      let html = '<h3 class="section-title">بيانات المدارس المتبقية</h3><div style="overflow-x:auto;"><table><thead><tr><th>القطاع</th><th>الجنس</th><th>اسم المدرسة</th><th>الأسلوب</th><th>تاريخ الزيارة</th><th>اليوم</th></tr></thead><tbody>';
      for (let i = 0; i < count; i++) {
        html += `<tr>
          <td>
            <select id="schSector_${i}" onchange="updateSchoolsDropdown(${i})" required>
              <option value="" disabled selected>اختر القطاع...</option>${sectorOptions}
            </select>
          </td>
          <td>
            <select id="schGender_${i}" onchange="updateSchoolsDropdown(${i})" required>
              <option value="" disabled selected>الجنس...</option>
              <option value="بنين">بنين</option><option value="بنات">بنات</option>
            </select>
          </td>
          <td><select id="schName_${i}" required><option value="" disabled selected>اختر المدرسة...</option></select></td>
          <td>
            <select id="schMethod_${i}" required>
              <option value="" disabled selected>اختر...</option>
              <option value="حضوري">حضوري</option><option value="عن بعد">عن بعد</option>
            </select>
          </td>
          <td><input type="date" id="schDate_${i}" required></td>
          <td>
            <select id="schDay_${i}" required>
              <option value="" disabled selected>اليوم...</option>
              <option value="الأحد">الأحد</option><option value="الاثنين">الاثنين</option>
              <option value="الثلاثاء">الثلاثاء</option><option value="الأربعاء">الأربعاء</option>
              <option value="الخميس">الخميس</option>
            </select>
          </td>
        </tr>`;
      }
      container.innerHTML = html + '</tbody></table></div>';
    }
  }

  function updateSchoolsDropdown(index) {
    let sector = document.getElementById(`schSector_${index}`).value;
    let gender = document.getElementById(`schGender_${index}`).value;
    let schoolSelect = document.getElementById(`schName_${index}`);
    
    schoolSelect.innerHTML = '<option value="" disabled selected>اختر المدرسة...</option>';
    if (sector && gender) {
      let filtered = window.appMetadata.schools.filter(s => s.sector === sector && s.gender === gender);
      filtered.forEach(s => { schoolSelect.innerHTML += `<option value="${s.school}">${s.school}</option>`; });
    }
  }

  function login() {
    let code = document.getElementById('accessCode').value;
    document.getElementById('dashboardContent').innerHTML = '<p>جاري تحميل وتحليل البيانات...</p>';
    
    google.script.run.withSuccessHandler(function(res) {
      if (res.success) {
        document.getElementById('dashTitle').innerText = `لوحة بيانات: ${res.name}`;
        document.getElementById('portalBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'block';
        
        google.script.run.withSuccessHandler(function(data) {
           window.dashboardData = data;
           populateSlicer(data.basic);
           renderDashboard();
           showView('dashboardView');
        }).getDashboardData(res.phase, res.role);

      } else { alert("كود الدخول غير صحيح!"); }
    }).verifyLeadershipLogin(code);
  }

  function populateSlicer(basicData) {
    let slicer = document.getElementById('supervisorSlicer');
    slicer.innerHTML = '<option value="">عرض الكل (إجمالي القطاعات)</option>';
    let uniqueSups = [...new Set(basicData.map(b => b.sup))].filter(Boolean);
    uniqueSups.forEach(s => slicer.innerHTML += `<option value="${s}">${s}</option>`);
  }

  function renderDashboard() {
    let selectedSup = document.getElementById('supervisorSlicer').value;
    let filteredBasic = window.dashboardData.basic;
    let filteredRem = window.dashboardData.rem;

    if (selectedSup) {
      filteredBasic = filteredBasic.filter(b => b.sup === selectedSup);
      filteredRem = filteredRem.filter(r => r.sup === selectedSup);
    }

    let t_assigned = 0, t_visited = 0, t_remaining = 0, t_remote = 0, t_inPerson = 0;
    let sectorsMap = {}; // تخزين المدارس المتبقية فقط

    filteredBasic.forEach(b => {
      t_assigned += b.assigned; 
      t_visited += b.visited; 
      t_remaining += b.remaining;
    });

    // سحب القطاعات حصرياً من المدارس المتبقية
    filteredRem.forEach(r => {
      if(r.method === "عن بعد") t_remote++;
      if(r.method === "حضوري") t_inPerson++;
      
      let sec = r.sector || "غير محدد";
      if(!sectorsMap[sec]) sectorsMap[sec] = 0;
      sectorsMap[sec] += 1;
    });

    let html = `<div class="stats-card">
      <div class="stat-item"><span class="stat-value">${t_assigned}</span><span class="stat-label">إجمالي المسندة</span></div>
      <div class="stat-item"><span class="stat-value">${t_visited}</span><span class="stat-label">تمت زيارتها</span></div>
      <div class="stat-item"><span class="stat-value">${t_remaining}</span><span class="stat-label">المتبقية</span></div>
      <div class="stat-item" style="border-right:3px solid #17A086"><span class="stat-value">${t_inPerson}</span><span class="stat-label">زيارات حضورية</span></div>
      <div class="stat-item" style="border-right:3px solid #005F56"><span class="stat-value">${t_remote}</span><span class="stat-label">زيارات عن بعد</span></div>
    </div>`;

    document.getElementById('dashboardContent').innerHTML = html;
    updateChart(sectorsMap);
  }

  function updateChart(sectorsMap) {
    if (window.remainingChartInstance) {
      window.remainingChartInstance.destroy();
    }

    // فرز القطاعات تنازلياً (من الأكبر للأصغر)
    let sortedData = Object.keys(sectorsMap).map(sec => ({
       sector: sec,
       count: sectorsMap[sec]
    })).filter(item => item.count > 0).sort((a, b) => b.count - a.count);

    let secLabels = sortedData.map(item => item.sector);
    let dataR = sortedData.map(item => item.count);
    
    // حساب المجموع لاستخراج النسبة المئوية الدقيقة
    let totalChartRemaining = dataR.reduce((sum, val) => sum + val, 0);

    let ctx = document.getElementById('remainingChart').getContext('2d');
    window.remainingChartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: secLabels,
        datasets: [{
          data: dataR,
          backgroundColor: ['#005F56', '#17A086', '#F2A900', '#D9534F', '#5BC0DE', '#5CB85C', '#8E44AD']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right' },
          tooltip: {
            callbacks: {
              label: function(context) {
                let val = context.raw;
                let perc = totalChartRemaining > 0 ? ((val / totalChartRemaining) * 100).toFixed(1) : 0;
                return ` العدد: ${val} | النسبة: ${perc}%`;
              }
            }
          }
        }
      }
    });
  }

  document.getElementById('performanceForm').onsubmit = function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.innerText = "جاري الحفظ لمعالجة البيانات...";
    
    const payload = {
      supervisorName: document.getElementById('supervisorName').value,
      studyPhase: document.getElementById('studyPhase').value,
      perfCycle: document.getElementById('perfCycle').value,
      gender: document.getElementById('gender').value,
      assignedCount: document.getElementById('assignedCount').value,
      visitedCount: document.getElementById('visitedCount').value,
      remainingCount: document.getElementById('remainingCount').value,
      remainingSchools: []
    };

    for (let i = 0; i < payload.remainingCount; i++) {
      payload.remainingSchools.push({
        sector: document.getElementById(`schSector_${i}`).value,
        gender: document.getElementById(`schGender_${i}`).value,
        schoolName: document.getElementById(`schName_${i}`).value,
        methodUsed: document.getElementById(`schMethod_${i}`).value,
        visitDate: document.getElementById(`schDate_${i}`).value,
        day: document.getElementById(`schDay_${i}`).value
      });
    }

    google.script.run.withSuccessHandler(function(res) {
      alert(res);
      document.getElementById('performanceForm').reset();
      document.getElementById('dynamicTableContainer').innerHTML = '';
      btn.disabled = false; btn.innerText = "إرسال البيانات";
      showView('mainView');
    }).processForm(payload);
  };
</script>
</body>
</html>
